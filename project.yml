name: Gimmy
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Gimmy:
    type: application
    platform: iOS
    sources:
      - path: Gimmy
        excludes:
          - "Resources/Info.plist"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_NAME: Gimmy
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: Gimmy/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  GimmyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GimmyTests
    dependencies:
      - target: Gimmy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Gimmy.app/Gimmy
        BUNDLE_LOADER: $(TEST_HOST)
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
  GimmyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GimmyUITests
    dependencies:
      - target: Gimmy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        TEST_TARGET_NAME: Gimmy
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
schemes:
  Gimmy:
    build:
      targets:
        Gimmy: all
        GimmyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GimmyTests
    archive:
      config: Release
  # README screenshots only (.github/workflows/screenshots.yml); not part of the regular CI.
  GimmyScreenshots:
    build:
      targets:
        Gimmy: all
        GimmyUITests: [test]
    test:
      config: Debug
      targets:
        - GimmyUITests
