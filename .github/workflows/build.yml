name: Build IPA

# Runs the unit tests, then builds an unsigned Gimmy.ipa (only if they pass).
# Sideloadly / AltStore sign the IPA with your Apple ID at install time.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"])
          ')
          xcodebuild test \
            -project Gimmy.xcodeproj \
            -scheme Gimmy \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    # Publishing the release needs write access to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write Config/Secrets.xcconfig
        env:
          APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
          GOOGLE_CLIENT_ID_PREFIX: ${{ secrets.GOOGLE_CLIENT_ID_PREFIX }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          {
            [ -n "$APP_BUNDLE_ID" ] && echo "APP_BUNDLE_ID = $APP_BUNDLE_ID"
            echo "GOOGLE_CLIENT_ID_PREFIX = $GOOGLE_CLIENT_ID_PREFIX"
            echo "SPREADSHEET_ID = $SPREADSHEET_ID"
          } > Config/Secrets.xcconfig

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project Gimmy.xcodeproj \
            -scheme Gimmy \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="1.0.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Gimmy.app Payload/
          zip -qr Gimmy.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Gimmy-ipa
          path: Gimmy.ipa
          retention-days: 30

      # SideStore installs and updates Gimmy from this release: it reads
      # https://github.com/<repo>/releases/latest/download/source.json, which points at this build's IPA.
      - name: Publish release for SideStore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PLIST=build/Build/Products/Release-iphoneos/Gimmy.app/Info.plist
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST")
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          TAG="v$VERSION"
          python3 .github/scripts/altsource.py \
            --repo "$GITHUB_REPOSITORY" \
            --bundle-id "$BUNDLE_ID" \
            --version "$VERSION" \
            --build "$BUILD" \
            --date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --download-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Gimmy.ipa" \
            --size "$(stat -f%z Gimmy.ipa)" \
            --sha256 "$(shasum -a 256 Gimmy.ipa | cut -d' ' -f1)" \
            --notes "$(git log -1 --pretty=%s)" > source.json
          gh release create "$TAG" Gimmy.ipa source.json \
            --title "Gimmy $VERSION" \
            --notes "$(git log -1 --pretty=%s)" \
            --latest
