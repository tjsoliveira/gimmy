name: Build IPA

# Runs the unit tests, then builds an unsigned Gimmy.ipa (only if they pass).
# Sideloadly / AltStore sign the IPA with your Apple ID at install time.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"])
          ')
          xcodebuild test \
            -project Gimmy.xcodeproj \
            -scheme Gimmy \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write Config/Secrets.xcconfig
        env:
          APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
          GOOGLE_CLIENT_ID_PREFIX: ${{ secrets.GOOGLE_CLIENT_ID_PREFIX }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          {
            [ -n "$APP_BUNDLE_ID" ] && echo "APP_BUNDLE_ID = $APP_BUNDLE_ID"
            echo "GOOGLE_CLIENT_ID_PREFIX = $GOOGLE_CLIENT_ID_PREFIX"
            echo "SPREADSHEET_ID = $SPREADSHEET_ID"
          } > Config/Secrets.xcconfig

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project Gimmy.xcodeproj \
            -scheme Gimmy \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Gimmy.app Payload/
          zip -qr Gimmy.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Gimmy-ipa
          path: Gimmy.ipa
          retention-days: 30
