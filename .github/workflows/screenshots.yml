name: Screenshots

# Opens the app on an iPhone simulator with sample data (launch argument -demo, debug builds only),
# captures the README screenshots and commits them to docs/screenshots.
# Run it by hand: Actions > Screenshots > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Boot a simulator with a clean status bar
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          pro = [d for d in phones if d["name"].endswith(" Pro")]
          print((pro or phones)[-1]["udid"])
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100

      - name: Capture screenshots
        run: |
          rm -rf docs/screenshots && mkdir -p docs/screenshots
          TEST_RUNNER_SCREENSHOTS_DIR="$PWD/docs/screenshots" xcodebuild test \
            -project Gimmy.xcodeproj \
            -scheme GimmyScreenshots \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
          ls docs/screenshots/*.png
          sips --resampleWidth 600 docs/screenshots/*.png

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots
          retention-days: 7

      - name: Commit the screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          # Every commit adds a line to the changelog, this one included.
          python3 .github/scripts/changelog.py "README screenshots updated."
          git add CHANGELOG.md
          git commit -m "Update README screenshots"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
